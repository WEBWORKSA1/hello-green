name: Auto-refresh site data

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull news, videos and climate data
        run: node _scripts/update-data.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "hello-green-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json sitemap.xml $(git ls-files '*.html')
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            git commit -m "Auto-refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request a Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request skipped."
